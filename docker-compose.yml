services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qoutefollow
      POSTGRES_PASSWORD: qoutefollow
      POSTGRES_DB: qoutefollow
    ports:
      - "5432:5432"
    volumes:
      - qoutefollow_pg:/var/lib/postgresql/data

volumes:
  qoutefollow_pg:
